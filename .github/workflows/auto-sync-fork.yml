name: Auto Sync Fork & Create PR

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Canary Branch
        uses: tgymnich/fork-sync@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: canary
          head: canary
          owner: lobehub

      - name: Sync Main Branch
        uses: tgymnich/fork-sync@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          head: main
          owner: lobehub

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create Pull Request to founderhub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base founderhub \
            --head main \
            --title "🔄 [Auto] Sync code from main to founderhub" \
            --body "Automated PR created after successfully syncing the \`main\` branch from upstream. Please review and merge into the \`founderhub\` branch." \
            || echo "PR already exists or no changes to merge."
