name: Auto Sync Fork & Create PR

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Canary Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST /repos/${{ github.repository }}/merge-upstream -f branch=canary || true

      - name: Sync Main Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST /repos/${{ github.repository }}/merge-upstream -f branch=main || true

      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check diff before creating PR
        id: check_diff
        run: |
          git fetch origin
          DIFF=$(git log origin/founderhub..origin/main --oneline 2>/dev/null || echo "")
          if [ -z "$DIFF" ]; then
            echo "No changes between main and founderhub. Skipping PR."
            echo "has_diff=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected."
            echo "has_diff=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request to founderhub
        if: steps.check_diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base founderhub \
            --head main \
            --title "🔄 [Auto] Sync code from main to founderhub" \
            --body "Automated PR created after successfully syncing the \`main\` branch from upstream. Please review and merge into the \`founderhub\` branch." \
          || echo "PR already exists or no changes to merge."
